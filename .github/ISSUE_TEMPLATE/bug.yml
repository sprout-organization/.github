name: Bug
description: Report a bug.
type: Bug
body:
  - type: textarea
    id: observed-behaviour
    attributes:
      label: Observed behaviour
      description: Provide a description of the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: Provide a description of the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List prerequisites and reproduction steps.
      placeholder: |
        Prerequisites:
        -

        Steps:
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Specify platform, versions, and relevant configuration.
    validations:
      required: false
  - type: dropdown
    id: regression
    attributes:
      label: Regression
      description: State whether this worked previously.
      options:
        - "Yes"
        - "No"
        - Unknown
      default: 2
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Define the requirements for completion.
      placeholder: |
        - [ ]
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Specify verification checks.
      placeholder: |
        - [ ]
    validations:
      required: false
  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Include any supporting details or material.
    validations:
      required: false
